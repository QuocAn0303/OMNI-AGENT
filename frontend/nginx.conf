# Aduu ERP — Nginx (frontend)
# HTTPS bắt buộc: HTTP chỉ dùng để redirect sang 443.
# Certificates mount vào /etc/nginx/certs (xem docker-compose.prod.yml).
# Nếu chưa có cert (dev/local), dùng self-signed hoặc đặt HTTPS_ONLY=off.

# Rate limit (WAF-lite) — chống brute-force ở lớp proxy trước khi tới backend
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=120r/m;
limit_req_status 429;

# Chặn request không có Host header hợp lệ (loại bỏ bot/scan cơ bản)
server {
    listen 80;
    server_name "";
    return 444;
}

server {
    listen 80 default_server;
    server_name _;

    # Chặn user-agent bot thường quét (có thể mở rộng)
    if ($http_user_agent ~* (sqlmap|nikto|nessus|acunetix|masscan|zgrab|python-requests|libwww-perl)) {
        return 403;
    }

    # Bắt buộc HTTPS — redirect toàn bộ
    location / {
        return 301 https://$host$request_uri;
    }

    # ACME (Let's Encrypt) cho phép qua HTTP khi renew cert
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — buộc trình duyệt luôn dùng HTTPS (1 năm, subdomains)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security headers (lớp proxy — song song với helmet ở backend)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-XSS-Protection "0" always;

    # CSP — CSP chính do backend helmet set; đây là lớp backup cho static
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Static assets — cache dài (có hash trong tên file)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API — proxy sang backend + rate limit
    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://app:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Rate limit chặt cho auth (login/register/2FA) — WAF-lite chống brute-force
    location ~ ^/api/auth/(login|register|2fa/verify|refresh)$ {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://app:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Socket.IO — websocket upgrade
    location /socket.io/ {
        proxy_pass http://app:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Chặn file ẩn/env (không bao giờ phục vụ config ra ngoài)
    location ~ /\. {
        deny all;
    }
}
